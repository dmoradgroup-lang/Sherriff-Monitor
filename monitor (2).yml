name: sheriff-sale-monitor
on:
  schedule:
    - cron: "0 */4 * * *"   # every 4 hours
  workflow_dispatch:
    inputs:
      test_email:
        description: "Only send a test email (no scanning)"
        type: boolean
        default: false
concurrency:
  group: sheriff-monitor
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Scan sheriff sales
        if: ${{ !inputs.test_email }}
        run: python -u sheriff_monitor.py
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
      - name: Send test email
        if: ${{ inputs.test_email }}
        run: python -u sheriff_monitor.py --test-email
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
      - name: Save state
        if: always()
        run: |
          git config user.name "monitor-bot"; git config user.email "bot@users.noreply.github.com"
          git add seen.json docs/data.json
          if git diff --cached --quiet; then echo "nothing to save"; exit 0; fi
          git commit -m "update state"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then exit 0; fi
            sleep 5
          done
          echo "FAILED TO SAVE STATE - duplicate emails are possible until this is fixed"
          exit 1
